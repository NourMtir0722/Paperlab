<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paperlab · FX Lab</title>
    <!--
      Effects on paper, and every knob behind them. Fire is the first.

      A directory with an index rather than `fx-lab.html`, so the URL is
      `/fx-lab`, and it reads as a page rather than as
      a file somebody left in the root.

      It SHIPS, like `/hands`: its own pass with its own base
      (`PAPERLAB_FXLAB=1`), assembled into the site by pages.yml. It began as
      the visual gate for the fire and it is a feature now — the
      library's fire defaults are a tune made on this page, every one of them
      is an option a consumer can set, and this is where you try them and copy
      the result.

      It wears the editor's frame (`src/styles.css`): the five-surface switch
      on top, the tool on the left, the sheet in the middle, the settings on
      the right, time underneath.

      What does NOT ship is the reference stills it can put beside the render:
      20 MB that live outside this repo (see `tools/fx-refs.mjs`), served by a
      dev-only middleware. The page says so where they would have been.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #08090a; }

      /* `?ui=0`: the stage alone, at exactly the viewport's size. That is what
         the capture script loads, so a photograph is never at the mercy of how
         wide the rails happened to render. */
      .lab.bare .stage { position: fixed; inset: 0; background: #000; }
    </style>
    <!--
      Cloudflare Web Analytics: free, cookieless, and it never logs the query
      string, so a shared scene in the address (?p=, ?s=) never reaches it.
      The token is public by design: it only lets this page REPORT visits.
      Loaded on the real site only. Anywhere else (a dev server, a preview, a
      harness) the report is refused, which is a console error the browser
      gates fail on, and a local visit is not a visitor anyway.
    -->
    <script>
      if (window.location.hostname === 'paperlab.nawwara.studio') {
        const beacon = document.createElement('script')
        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js'
        beacon.dataset.cfBeacon = '{"token": "eb1e736495f549028366e8c05959c856"}'
        document.head.append(beacon)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/harness/fx-lab-main.tsx"></script>
  </body>
</html>
