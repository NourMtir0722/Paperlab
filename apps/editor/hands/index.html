<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paperlab — hands · set the paper alight</title>
    <!--
      This page may talk to its own origin, and to exactly one other place.

      Not a precaution — the claim in the panel, made enforceable. MediaPipe
      POSTs a usage log to https://odml.pa.googleapis.com/v1/log, with an API
      key, from inside the task runner, and there is no documented way to turn
      it off. `connect-src` turns it off from the outside.

      storage.googleapis.com is allowed because the model WEIGHTS are loaded
      from Google rather than served from here. Google publishes no licence for
      them — not on the task's docs page, not on the models page, and the model
      card those link to is a 404 — so hosting them ourselves would be
      redistribution under terms nobody can read. Linking is not. The wasm is a
      different matter and is served from this origin: it is executable code,
      and it is Apache-2.0, so there is no question.

      Worth knowing how far this reaches, because it is less far than it looks.
      It stops anything the page tries to SEND. It does NOT stop the wasm
      loader fetching its own glue from elsewhere — that happens in a worker
      and sails straight through — so `pnpm test:hands` separately asserts that
      the only third-party origin the page touches is the model host, and that
      the telemetry endpoint is never among them. Neither layer alone is enough.

      `ws:` is for Vite's dev HMR socket, which shares the origin but not the
      scheme; `blob:` is how the wasm loader instantiates its worker;
      `mediastream:` is the camera feed reaching the <video> element.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' blob: data:; connect-src 'self' https://storage.googleapis.com ws: wss: blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:"
    />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0b0b; overflow: hidden; }
      body { font-family: "Inter", system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.92); }
      #root { height: 100%; }
      .stage { position: fixed; inset: 0; }

      .hud {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 260px;
        padding: 16px;
        border-radius: 12px;
        background: rgba(18,18,18,0.82);
        border: 1px solid rgba(255,255,255,0.09);
        backdrop-filter: blur(12px);
      }
      .hud h1 { margin: 0 0 6px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; }
      .sub { margin: 0 0 14px; font-size: 12px; line-height: 1.5; color: rgba(255,255,255,0.5); }
      .hud button {
        width: 100%;
        padding: 9px 12px;
        font: inherit;
        font-size: 13px;
        color: #111;
        background: rgba(255,255,255,0.94);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      .hud button:disabled { opacity: 0.5; cursor: default; }
      .readout {
        margin: 12px 0 0;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: rgba(255,255,255,0.55);
        min-height: 1em;
      }
      .note { margin: 10px 0 0; font-size: 11px; line-height: 1.5; color: rgba(255,255,255,0.5); }
      .hud button.ghost {
        margin-top: 10px;
        color: rgba(255,255,255,0.8);
        background: transparent;
        border: 1px solid rgba(255,255,255,0.16);
      }
      .error { margin: 8px 0 0; font-size: 11px; line-height: 1.5; color: #ff8a8a; }

      /*
        What the camera sees, drawn over the stage: the hand's bones and a box
        round it, and a box round a flame once one is found. Never in the way
        of anything — it is a picture of the tracker, not a control.
      */
      .overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

      /* The proof a flame was found, at the top of the page, while it is seen. */
      .banner {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #1a0b00;
        background: #ff8a2a;
        box-shadow: 0 0 0 1px rgba(255,190,120,0.6), 0 0 28px rgba(255,120,30,0.55);
        pointer-events: none;
        animation: banner-in 180ms ease-out;
      }
      .banner .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #fff4d6;
        animation: pulse 0.9s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.7); } }
      @keyframes banner-in { from { opacity: 0; transform: translate(-50%, -8px); } }
      @media (prefers-reduced-motion: reduce) {
        .banner, .banner .dot { animation: none; }
      }

      /*
        The camera's own picture, mirrored so the hand on screen moves the way
        your hand moves. Small and under the panel: it is how you aim a flame
        you are holding, and how anyone can see what the page can see.
      */
      .camera {
        position: fixed;
        left: 20px;
        bottom: 20px;
        width: 220px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.09);
        transform: scaleX(-1);
        display: block;
      }

      .cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.9);
        pointer-events: none;
        opacity: 0;
        transition: opacity 140ms ease, background-color 90ms ease;
        will-change: transform;
      }
      /*
        The match, while it is being struck and once it is lit.

        The flame itself is drawn in the scene (`FxMatchFlame`) — sparks, a
        strike, and the light it throws. This ring is only the aim, and it
        warms as the match takes: a gesture with no feedback is a gesture
        nobody finds, and holding a pinch still for a third of a second showed
        absolutely nothing until the ring said it was working.
      */
      .cursor[data-flame="arming"] { border-color: rgba(255,176,88,0.75); }
      .cursor[data-flame="lit"] {
        border-color: rgba(255,168,72,0.95);
        box-shadow: 0 0 14px rgba(255,140,40,0.55);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/harness/hands-main.tsx"></script>
  </body>
</html>
