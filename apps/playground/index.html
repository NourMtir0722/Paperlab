<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The address here can carry a shared scene, and a page's full address is
      the referrer the next page reads, analytics included. Origin only.
    -->
    <meta name="referrer" content="origin" />
    <title>Paperlab · write a room</title>
    <meta name="description" content="Type something. Walk through it. Real 3D paper as a React component." />

    <!--
      A shared link with no card is a link nobody clicks. og:image has to be
      an absolute URL; it points at the site's own domain rather than a raw
      GitHub path, which would carry the account name and die on a rename.
    -->
    <meta property="og:url" content="https://paperlab.nawwara.studio/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paperlab" />
    <meta property="og:title" content="Paperlab · write a room" />
    <meta property="og:description" content="Type something. Walk through it. Real 3D paper as a React component." />
    <meta property="og:image" content="https://paperlab.nawwara.studio/media/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paperlab · write a room" />
    <meta name="twitter:description" content="Type something. Walk through it. Real 3D paper as a React component." />
    <meta name="twitter:image" content="https://paperlab.nawwara.studio/media/og.png" />

    <meta name="theme-color" content="#0b0b0b" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0b0b;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        text-align: center;
        opacity: 0;
        animation: boot-in 300ms ease 220ms forwards;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      .boot-mark {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.95);
      }
      .boot-line {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.55);
        max-width: 26rem;
      }
      .boot-bar {
        width: 168px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.07);
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.95);
        animation: boot-slide 1.4s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      /* Someone who asked for less motion gets a bar that simply sits there
         rather than one that runs for as long as the wait lasts. */
      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation-delay: 0ms;
        }
        .boot-bar span {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
    <!--
      DataFast reports the whole address, and a shared link carries its scene
      in it (?s=), text someone typed included. So the scene comes out of
      the address before the tracker reads it, and goes back in once the
      tracker has run or failed to load. That is still before the app reads
      it: deferred scripts run in document order, and the app comes after.
      The campaign tags (ref, utm_*) have been read by then too, so they are
      dropped rather than carried into a link someone copies.
    -->
    <script>
      ;(() => {
        var url = new URL(window.location.href)
        var clean = new URL(url)
        clean.searchParams.delete('s')
        var after = new URL(url)
        Array.from(after.searchParams.keys())
          .filter((key) => /^(ref|source|via|utm_\w+)$/.test(key))
          .forEach((key) => after.searchParams.delete(key))
        if (clean.href !== url.href) window.history.replaceState(window.history.state, '', clean)
        window.__afterAnalytics = () => {
          if (window.location.href !== after.href) window.history.replaceState(window.history.state, '', after)
        }
      })()
    </script>
    <script
      defer
      data-website-id="dfid_uU6pKnQTSOEqlp1IVWGQ4"
      data-domain="paperlab.nawwara.studio"
      src="https://datafa.st/js/script.js"
      onload="__afterAnalytics()"
      onerror="__afterAnalytics()"
    ></script>
  </head>
  <body>
    <!--
      The first paint, written into the document.

      All three apps are a single React bundle over a megabyte of three.js,
      and until it parses there is nothing in `#root` — measured on a cold
      cache over throttled 4G, every one of them showed a **completely blank
      page for the best part of two seconds**. Blank is the one thing the
      phase-07 done test forbids, and it is worse than slow: a visitor cannot
      tell a heavy scene from a broken link.

      This costs no request and no JavaScript. It is markup and inline CSS,
      so it is on screen with the first byte of the document, and
      `createRoot().render()` replaces the children of `#root` the moment the
      app mounts — there is nothing to tear down.

      The fade is delayed on purpose. A warm cache mounts in well under
      200ms, and a loading state that flashes on a fast load is noise; this
      one only ever appears for the visitors who were going to wait anyway.
    -->
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <p class="boot-mark">Paperlab</p>
        <p class="boot-line">Building the room. The first scene is real 3D geometry, so it takes a moment on a cold load.</p>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
