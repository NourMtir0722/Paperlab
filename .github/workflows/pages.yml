name: Deploy site

# A 3D library nobody can try is a screenshot, so the site is the demo.
# The root is a signpost that picks by device — the editor is a three-rail
# desktop tool with no mobile layout, the playground was built for a phone —
# and the apps sit at /editor, /playground and /docs behind it.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# No secrets, no third-party account: the OIDC token below is issued by
# GitHub to this workflow.
#
# Live at https://paperlab.nawwara.studio/ — a custom domain, so the URL
# survives a GitHub username change. The CNAME file below is what keeps it:
# this deploys via Actions rather than from a branch, and without a CNAME in
# the artifact each deploy clears the custom domain and takes the site down.
#
# The `has_pages` guard below is deliberate. Pages must be enabled on the
# repository (Settings -> Pages -> Source: "GitHub Actions") and the repository
# must be public; until both are true, `deploy-pages` 404s on every push. The
# guard skips the deploy instead of failing it, and `workflow_dispatch` is the
# escape hatch to publish once Pages has been switched on -- this workflow
# triggers on push, so enabling Pages alone does not build the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Site root. On the custom domain the site is the apex, not a subpath.
  BASE: /
  DOMAIN: paperlab.nawwara.studio

jobs:
  build:
    # Skipped while Pages is off, which also skips deploy (it `needs` this).
    # A manual run forces it anyway, so the build stays testable from the
    # Actions tab. Note the apps are already built by CI on every push
    # (`pnpm build` → `tsc --noEmit && vite build` in all three), so nothing
    # is lost by not running here; what this job adds is the PAPERLAB_BASE
    # subpath wiring and the site assembly, and neither is exercisable
    # without somewhere to put the result.
    if: github.event.repository.has_pages || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm --filter paperlab build

      - name: Build the playground (/playground)
        run: pnpm --filter @paperlab/playground exec vite build
        env:
          PAPERLAB_BASE: ${{ env.BASE }}playground/

      - name: Vendor the hand tracker's wasm (/hands)
        run: pnpm hands:setup

      - name: Build the editor (/editor)
        run: pnpm --filter @paperlab/editor exec vite build
        env:
          PAPERLAB_BASE: ${{ env.BASE }}editor/

      - name: Build the hands page (/hands)
        # A second pass over the same app with its own base, so the route is
        # self-contained rather than reading its JavaScript out of /editor.
        run: pnpm --filter @paperlab/editor exec vite build
        env:
          PAPERLAB_HANDS: '1'
          PAPERLAB_BASE: ${{ env.BASE }}hands/

      - name: Build the reference (/docs)
        run: pnpm --filter @paperlab/docs exec vite build
        env:
          PAPERLAB_BASE: ${{ env.BASE }}docs/

      - name: Assemble the site
        run: |
          mkdir -p site
          # The root picks a destination by device; the apps sit behind it.
          cp tools/site-root.html site/index.html
          mkdir -p site/playground
          cp -r apps/playground/dist/* site/playground/
          mkdir -p site/editor
          cp -r apps/editor/dist/* site/editor/
          # A route of its own rather than a page under /editor — it is its
          # own thing, like the playground and the docs.
          mkdir -p site/hands
          cp apps/editor/dist-hands/hands/index.html site/hands/index.html
          cp -r apps/editor/dist-hands/hands/tracker site/hands/tracker
          cp -r apps/editor/dist-hands/assets site/hands/assets
          mkdir -p site/docs
          cp -r apps/docs/dist/* site/docs/
          # Pages serves 404.html for unknown paths; point it at the root
          # signpost so a stale shared link still lands on something.
          cp site/index.html site/404.html
          # The README on npm cannot resolve repo-relative paths, so its
          # images point here. Serving them off the domain rather than
          # raw.githubusercontent keeps them alive across a username change.
          cp -r docs/media site/media
          # Pages reads the custom domain from this file on every deploy.
          echo "$DOMAIN" > site/CNAME
          # .nojekyll keeps Pages from eating asset dirs that start with _.
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # Deliberately NOT `|| workflow_dispatch` like build is: deploying is the
    # half that cannot work without Pages, so a manual run builds and
    # assembles the site and stops there rather than 404ing again.
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
