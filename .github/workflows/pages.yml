name: Deploy site

# The playground is the demo — a 3D library nobody can try is a screenshot.
# Publishes the playground at the site root, the editor at /editor, and the
# reference at /docs.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# No secrets, no third-party account: the OIDC token below is issued by
# GitHub to this workflow.
#
# LIVE since 2026-08-22 at https://nourmtir0722.github.io/Paperlab/.
#
# The history is worth keeping, because it cost two wrong diagnoses. Pages
# refused to serve while the repo was PRIVATE (the API answers 422, "Your
# current plan does not support GitHub Pages"), and both jobs failed on every
# push from 2026-08-12 to 2026-08-13 — build fine, deploy-pages 404 — mailing
# a failure each time for a site that could not exist. That is what the
# `has_pages` guard below is for.
#
# Going public was then necessary but NOT sufficient, which is the part that
# surprised us: `has_pages` stayed false and this workflow reported `skipped`
# on every push, because Pages itself still had to be switched on in
# Settings → Pages → Source: "GitHub Actions". Once it was, the site had
# still never built — this triggers on push, and there had been none since.
# `gh workflow run pages.yml --ref main` deployed it in 46 seconds.
#
# So: the guard is a guard, not a disabled workflow, and `workflow_dispatch`
# is the escape hatch for exactly the case above.
#
# On a custom domain (paperlab.dev), set BASE to '/' and add the CNAME step.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Project-pages subpath. Change to '/' when a custom domain is attached.
  BASE: /Paperlab/

jobs:
  build:
    # Skipped while Pages is off, which also skips deploy (it `needs` this).
    # A manual run forces it anyway, so the build stays testable from the
    # Actions tab. Note the apps are already built by CI on every push
    # (`pnpm build` → `tsc --noEmit && vite build` in all three), so nothing
    # is lost by not running here; what this job adds is the PAPERLAB_BASE
    # subpath wiring and the site assembly, and neither is exercisable
    # without somewhere to put the result.
    if: github.event.repository.has_pages || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm --filter paperlab build

      - name: Build the playground (site root)
        run: pnpm --filter @paperlab/playground exec vite build
        env:
          PAPERLAB_BASE: ${{ env.BASE }}

      - name: Build the editor (/editor)
        run: pnpm --filter @paperlab/editor exec vite build
        env:
          PAPERLAB_BASE: ${{ env.BASE }}editor/

      - name: Build the reference (/docs)
        run: pnpm --filter @paperlab/docs exec vite build
        env:
          PAPERLAB_BASE: ${{ env.BASE }}docs/

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r apps/playground/dist/* site/
          mkdir -p site/editor
          cp -r apps/editor/dist/* site/editor/
          mkdir -p site/docs
          cp -r apps/docs/dist/* site/docs/
          # Pages serves 404.html for unknown paths; point it at the
          # playground so a stale shared link still lands on something.
          cp site/index.html site/404.html
          # .nojekyll keeps Pages from eating asset dirs that start with _.
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Deliberately NOT `|| workflow_dispatch` like build is: deploying is the
    # half that cannot work without Pages, so a manual run builds and
    # assembles the site and stops there rather than 404ing again.
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
