name: Release

on:
  push:
    branches: [main]
  # A DRY RUN of the release path, on demand.
  #
  # This exists because of a specific hole: every other workflow is validated
  # by CI on a pull request, and this one is not — it only runs on a push to
  # main, which means the first time anybody finds out whether a change broke
  # the release is after that change has already been merged. That is not
  # hypothetical here. 0.2.0's publish failed with `EUNKNOWNCONFIG` AFTER the
  # version bump had landed on main, and `0.1.0` is now a version that will
  # never exist on the registry.
  #
  # Dispatching this from a branch runs THAT branch's copy of this file, so a
  # dependency bump touching `checkout`, `setup-node` or `pnpm/action-setup`
  # can be exercised on its own branch before it is merged — which is the
  # only way to review one of those honestly.
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish. Leave off to exercise the path without releasing."
        type: boolean
        default: false

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history. `changeset status` finds what would be released by
      # merge-basing against main, and merge-base does not work in a shallow
      # clone — fetching main afterwards is not enough either, because the
      # grafted history has no common ancestor to find. This repo is under a
      # hundred commits; the clone costs nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1 and Node 22 ships npm 10,
      # so npm still has to be upgraded — but no longer PINNED.
      #
      # It was pinned to 11 because pnpm handed its own `--no-git-checks` down
      # to npm, which npm 12 rejects outright (EUNKNOWNCONFIG), failing the
      # publish after the version bump had already landed on main. pnpm fixed
      # that in #10077 by stripping its own flags before calling npm, and this
      # repo is on pnpm 11, so the pin has done its job and can go.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Everything above this line is the release PATH — the setup, the pin,
      # the install and the build. Everything below is the release ITSELF.
      # A dry run stops here, having proved the half that keeps breaking.
      - name: Dry run — report what the release would have used
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: |
          echo "node    $(node --version)"
          echo "npm     $(npm --version)   # >= 11.5.1 for OIDC trusted publishing"
          echo "pnpm    $(pnpm --version)  # must match packageManager in package.json"
          echo
          node -e 'const [a,b]=[process.argv[1].split(".").map(Number),[11,5,1]];
            const ok=a[0]>b[0]||(a[0]===b[0]&&(a[1]>b[1]||(a[1]===b[1]&&a[2]>=b[2])));
            if(!ok){console.log("::error::npm "+process.argv[1]+" is below 11.5.1, which is the floor for OIDC trusted publishing.");process.exit(1)}' "$(npm --version)"

          want=$(node -p "(require('./package.json').packageManager||'@').split('@')[1]||''")
          got=$(pnpm --version)
          if [ -n "$want" ] && [ "${want%%.*}" != "${got%%.*}" ]; then
            echo "::error::pnpm major mismatch: packageManager wants $want, runner has $got."
            echo "::error::pnpm/action-setup resolves the version FROM packageManager when"
            echo "::error::no version input is given, so a disagreement here means the"
            echo "::error::action changed how it reads that field."
            exit 1
          fi
          echo
          # The pairing the dry run structurally cannot test by running it:
          # this step stops BEFORE the publish action, so the action itself
          # is never loaded. changesets/action v1 requires CLI v2 and v2
          # requires CLI v3, and taking one without the other fails at the
          # very last step of a real release — after the version bump has
          # landed. Assert the pairing instead of exercising it.
          action=$(grep -oE 'changesets/action@v[0-9]+' .github/workflows/release.yml | head -1 | sed 's/.*@v//')
          cli=$(node -p "require('./package.json').devDependencies['@changesets/cli'].replace(/[^0-9]*/,'').split('.')[0]")
          echo "changesets action v$action  <->  CLI v$cli"
          if [ "$action" = "1" ] && [ "$cli" != "2" ]; then
            echo "::error::changesets/action v1 requires CLI v2, found v$cli."; exit 1
          fi
          if [ "$action" = "2" ] && [ "$cli" != "3" ]; then
            echo "::error::changesets/action v2 requires CLI v3, found v$cli. Migrate the"
            echo "::error::CLI first — the action fails at the publish step, which is after"
            echo "::error::the version bump has already landed on main."
            exit 1
          fi

          echo
          echo "--- what would be released ---"
          # Needs the full clone above: this merge-bases against main, and
          # merge-base cannot work in a shallow one. Still non-fatal — the
          # version assertions are the gate, and a dry run that goes red for
          # a reason unrelated to the release is one nobody will trust.
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
          pnpm exec changeset status --since=origin/main \
            || echo "(could not compute — the assertions above are the gate)"

      # No NPM_TOKEN: npm authenticates this workflow via OIDC, configured as a
      # trusted publisher on the package. Provenance should now arrive on its
      # own — npm would not attest a build from a private repo, which is why
      # 0.2.0 carries no attestations, and this repo went public 2026-08-21.
      # PINNED TO v1, and it is not a stale pin — v2 is unusable here.
      #
      #   "This version of the Changesets action is designed to work with
      #    Changesets CLI v3. Changesets CLI v2 is not supported; use
      #    Changesets action v1 instead."
      #
      # This repo is on `@changesets/cli ^2.31.1`. Moving to the v2 action
      # therefore means migrating the CLI to v3 FIRST, as its own deliberate
      # piece of work — not as a dependency bump. The step below is checked
      # against that on every dry run; see "action and CLI majors agree".
      #
      # When that migration happens, v2 also renamed the inputs and stopped
      # reading the token from the environment: `publish` -> `publish-script`,
      # and `github-token` must be passed as an input.
      - name: Create release PR or publish to npm
        if: github.event_name == 'push' || inputs.publish
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
