name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      # Pinned to 11 rather than `latest`, and the pin is load-bearing:
      # changesets publishes through pnpm, and pnpm hands its own
      # `--no-git-checks` down to npm. npm 11 warns about the unknown flag and
      # carries on; npm 12 rejects it outright (EUNKNOWNCONFIG) and the publish
      # fails after the version bump has already landed on main. Unpin when
      # pnpm or changesets stops passing that flag to npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # No NPM_TOKEN: npm authenticates this workflow via OIDC, configured as a
      # trusted publisher on the package. Provenance is automatic.
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
