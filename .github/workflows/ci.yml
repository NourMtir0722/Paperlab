name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Dead code (knip)
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package publish safety (publint + arethetypeswrong)
        run: pnpm --filter paperlab run check:package

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: GPU parity gate
        run: pnpm test:parity

      # The navigation is pointer capture, wheel and key handlers against a
      # live canvas. The math has unit tests; only a browser can say whether
      # the listeners are on the thing the visitor is actually touching.
      - name: Stage navigation gate
        run: pnpm test:drive
