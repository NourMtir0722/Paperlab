name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Six jobs, and `ci` is the one that matters.
#
# This was one job with a 20-minute limit, and the browser gates run one after
# another on runners with no GPU — every WebGL frame drawn by SwiftShader on
# the CPU. On main it already took ~18 of its 20 minutes (the dropdown gate
# alone is ~7, stage navigation ~4.5), so the first gate to get slower, or the
# first gate added, pushed it over and the whole check was CANCELLED rather
# than failed — which is what PR #83 showed, on every push, with nothing wrong
# in any test. Split by measured time, each group has its own 20 minutes and
# they run at once.
#
# `ci` is the check the `protect-main` ruleset requires, so it stays, as the
# job that stands for all the others: it waits for every one of them and fails
# unless each one passed. A skipped required job counts as a pass on GitHub,
# which is why it checks for skipped and cancelled as well as failed.

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Dead code (knip)
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Vendor the hand tracker's wasm
        # A copy out of node_modules, no network: the build emits the /hands
        # page now, and without this it would emit one that 404s its runtime.
        run: pnpm hands:setup

      - name: Build
        run: pnpm build

      # `packages/paperlab/README.md` is GENERATED from the root one during the
      # library build (tools/sync-readme.mjs) and committed, so npm's page
      # cannot go stale in a published tarball. The committed copy still can,
      # any time someone edits the root README without building — which is how
      # it came to be a whole stage-mode rewrite behind. The build ran two
      # steps ago; if it changed a tracked file, that file was stale.
      - name: Generated files are up to date
        run: git diff --exit-code

      - name: Package publish safety (publint + arethetypeswrong)
        run: pnpm --filter paperlab run check:package

      # publint and arethetypeswrong read the manifest and the types. They
      # cannot load the files, and the workspace always has every optional
      # peer installed, so neither has ever run this package from a tree that
      # looks like a consumer's. Two bugs shipped through that gap — stage's
      # module-scope import of an OPTIONAL peer, and a CJS build that could
      # not be `require`d at all — and both were invisible here until
      # something actually installed the tarball somewhere else.
      - name: Consumer install gate
        run: pnpm test:consumer

  # ~5.5 minutes on main: parity, stage navigation, the share loop, routing.
  gates-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gates serve the editor from a dev server, but they ran after these
      # two steps for as long as they have existed, so they keep them: a gate
      # that quietly depended on a vendored wasm or a built package should not
      # find out here.
      - name: Vendor the hand tracker's wasm
        run: pnpm hands:setup

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: GPU parity gate
        run: pnpm test:parity

      # The navigation is pointer capture, wheel and key handlers against a
      # live canvas. The math has unit tests; only a browser can say whether
      # the listeners are on the thing the visitor is actually touching.
      - name: Stage navigation gate
        run: pnpm test:drive

      # "Papers are made to be passed around" is a claim the README makes and
      # a whole section of the product exists to keep. The loop it checks —
      # sculpt, copy a link, open it in a browser that has never seen the
      # paper — runs across two browser contexts and touches the clipboard,
      # localStorage and the URL, none of which the unit suite can see. It
      # was the one harness in the repo nothing ran.
      - name: Share loop gate
        run: pnpm test:share

      # The site root decides, in a script inside an HTML file, which app
      # every visitor sees — the editor has no mobile layout, so guessing
      # wrong strands a phone on a three-rail desktop tool. Nothing else in
      # the pipeline type-checks or renders that file, so check it directly.
      - name: Root routing gate
        run: pnpm test:route

  # ~7 minutes on main, on its own.
  gates-dropdown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vendor the hand tracker's wasm
        run: pnpm hands:setup

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The select is the app's own, so its option list is app DOM in a
      # scrolling box. It shipped dismissing itself on its own scroll, which
      # put every option below the fold out of reach of a mouse with nothing
      # in the console to say so. Only a browser can tell whether the whole
      # list is reachable.
      - name: Dropdown reach gate
        run: pnpm test:dropdown

  # The damage seam gate on its own: >5 minutes on its own on PR #83.
  gates-damage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vendor the hand tracker's wasm
        run: pnpm hands:setup

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `<Paper damage>` compiles a different program — another chunk, another
      # sampler, a different alpha test — and claims that on an untouched field
      # it draws exactly what the sheet drew without one. That is an argument
      # about arithmetic until something renders both and compares them; this
      # does, on the opaque stock and the one below full opacity, with a
      # scorched field as the control that proves it can see a difference.
      - name: Damage seam gate
        run: pnpm test:damage

  # The fire's budgets on their own: every shot seeks a burn and warms the
  # fire simulator up from still air, on the CPU. With the damage seam gate in
  # the same job it ran past 16 minutes of its 20.
  #
  # 30 minutes, not 20: alone, it has grown with the fire it measures — 10m on
  # main before the burn gained its char, light and motion (#88), 15–19m since
  # (19m16 at its slowest), and a PR run at 20m13 was cancelled mid-pass with
  # every check it had reached still green. The known next cut is to take the
  # peak and the peak without bloom from one page load: each load re-warms the
  # simulator on the CPU.
  gates-fire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vendor the hand tracker's wasm
        run: pnpm hands:setup

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # What the fire must MEASURE, as opposed to what it must not break.
      # `test:fire-look` is the gate that photographs the burn beside the
      # stills it is meant to look like, and it can never run here: those
      # references are 20 MB kept deliberately out of this repo. Every check in
      # this one compares the frame to itself with one thing switched off, so
      # it needs nothing but the app. It exists because all twelve of
      # fire-look's checks passed while a review scored the result 3.5/10 —
      # they all ask "did nothing change that should not have", and none asked
      # whether the fire was bright enough to be a fire. This one does.
      - name: Fire budgets
        run: pnpm test:fire-budget

  # The required check. See the note at the top.
  ci:
    needs: [checks, gates-stage, gates-dropdown, gates-damage, gates-fire]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "Not every job passed: checks ${{ needs.checks.result }}, gates-stage ${{ needs.gates-stage.result }}, gates-dropdown ${{ needs.gates-dropdown.result }}, gates-damage ${{ needs.gates-damage.result }}, gates-fire ${{ needs.gates-fire.result }}"
          exit 1

      - run: echo "checks, gates-stage, gates-dropdown, gates-damage and gates-fire all passed."
